name: Update UI-tests References

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash -l {0}

jobs:
  update-reference-screenshots:
    name: Update UI Tests References
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, 'update playwright snapshots') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check the commenter's permission and check out the PR
        uses: jupyterlab/maintainer-tools/.github/actions/update-snapshots-checkout@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Micromamba
        uses: mamba-org/provision-with-micromamba@v16

      - name: Install dependencies and build tests
        run: |
          python -m pip install ".[test]"
          cd ui-tests
          jlpm install --immutable

      - uses: jupyterlab/maintainer-tools/.github/actions/update-snapshots@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          test_folder: ui-tests